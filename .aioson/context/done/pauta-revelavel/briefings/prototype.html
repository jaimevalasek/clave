<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pauta revelável · protótipo</title>
<style>
:root{
  --fundo:#0B0A08;--folha:#100E0B;--sup:#161310;--sup2:#1D1914;--solido:#242019;
  --texto:#F5F1E8;--texto2:#CDC5B4;--fumaca:#8F8674;
  --pauta:rgba(224,203,163,.075);--linha:rgba(224,203,163,.14);--linha2:rgba(233,214,177,.28);
  --destaque:#E8BA52;--destaque-tinta:#1A1408;
  --ok:#6EC6A2;--perigo:#E25D5D;--cobre:#D8895B;--margem:transparent;
  --f-ui:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --f-voz:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --f-maq:"JetBrains Mono","Cascadia Code",ui-monospace,monospace;
  --passo:44px;--texto-tam:30px;--t:150ms ease;
  --r-ctl:8px;--r-bloco:10px;--r-painel:16px;--r-chip:99px;--r-mini:4px;
  --sobre-perigo:#FFFFFF;--sombra-lift:0 18px 40px -16px rgba(0,0,0,.55);--sombra-toast:0 12px 30px -18px rgba(0,0,0,.6);--veu:rgba(5,4,3,.62);--veu-tour:rgba(5,4,3,.66);--alvo:34px;
  color-scheme:dark;
}
[data-tema="porcelana"]{--fundo:#F1EDE3;--folha:#F9F6EE;--sup:#FFFDF7;--sup2:#EFE9DC;--solido:#FFFDF7;--texto:#1C1710;--texto2:#4C4436;--fumaca:#6F6656;--pauta:rgba(60,45,20,.085);--linha:rgba(60,45,20,.16);--linha2:rgba(60,45,20,.32);--destaque:#8A6512;--destaque-tinta:#FFF8E6;--ok:#177A58;--perigo:#BF3D47;--cobre:#A55A30;color-scheme:light}
[data-tema="caderno"]{--fundo:#E4DDCB;--folha:#FBF8EF;--sup:#FFFDF6;--sup2:#EFE9DA;--solido:#FFFDF6;--texto:#22201B;--texto2:#4A463C;--fumaca:#6E6757;--pauta:rgba(70,100,150,.2);--linha:rgba(40,40,30,.16);--linha2:rgba(40,40,30,.32);--destaque:#B23A3A;--destaque-tinta:#FFF6F2;--ok:#177A58;--perigo:#9E2B48;--cobre:#A55A30;--margem:rgba(178,58,58,.5);color-scheme:light}
[data-tema="lousa"]{--fundo:#111B17;--folha:#17261F;--sup:#1C2E26;--sup2:#22362D;--solido:#223A30;--texto:#EEF2E8;--texto2:#C9D3C3;--fumaca:#8FA092;--pauta:rgba(238,242,232,.075);--linha:rgba(238,242,232,.14);--linha2:rgba(238,242,232,.28);--destaque:#E8D27A;--destaque-tinta:#1B1A0C}
[data-tema="contraste"]{--fundo:#0B0A08;--folha:#0B0A08;--sup:#151311;--sup2:#1E1B17;--solido:#1E1B17;--texto:#FFFFFF;--texto2:#ECE8DE;--fumaca:#BDB6A7;--pauta:rgba(255,255,255,.1);--linha:rgba(255,255,255,.3);--linha2:rgba(255,255,255,.55);--destaque:#FFD34D;--destaque-tinta:#14110A}

:root{--c-vermelho:#EF6F6F;--c-verde:#6EC6A2;--c-cobre:#D8895B;--c-lilas:#B49BD8}
[data-tema="porcelana"]{--c-vermelho:#BF3D47;--c-verde:#177A58;--c-cobre:#A55A30;--c-lilas:#6C4E9B}
[data-tema="caderno"]{--destaque:#9C6400;--destaque-tinta:#FFF8E6;--c-vermelho:#B23A3A;--c-verde:#1F7A4F;--c-cobre:#A55A30;--c-lilas:#6C4E9B}
[data-tema="lousa"]{--c-vermelho:#F2938A;--c-verde:#9ED9A0;--c-cobre:#E8A86B;--c-lilas:#C9B3F0}
[data-tema="contraste"]{--c-vermelho:#FF7A7A;--c-verde:#7CF0B8;--c-cobre:#FFB27A;--c-lilas:#D2B8FF}

*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--fundo);color:var(--texto);font:400 15px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased;background-attachment:fixed}
body.fundo-livre{background:var(--fundo-livre) center/cover fixed}
::selection{background:color-mix(in srgb,var(--destaque) 40%,transparent);color:var(--texto)}
:focus-visible{outline:2px solid var(--destaque);outline-offset:3px;border-radius:6px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
svg{display:block}
.mono{font-family:var(--f-maq)}
.voz{font-family:var(--f-voz);font-style:italic}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;height:var(--alvo);padding:0 12px;border-radius:var(--r-ctl);border:1px solid var(--linha);font:500 13px/1 var(--f-ui);color:var(--texto2);white-space:nowrap;transition:background var(--t),color var(--t),border-color var(--t)}
.btn:hover{background:var(--sup2);color:var(--texto);border-color:var(--linha2)}
.btn[aria-pressed="true"]{color:var(--perigo);border-color:color-mix(in srgb,var(--perigo) 55%,transparent);background:color-mix(in srgb,var(--perigo) 10%,transparent)}
.btn-primario{background:var(--destaque);border-color:var(--destaque);color:var(--destaque-tinta);font-weight:600}
.btn-primario:hover{background:color-mix(in srgb,var(--destaque) 86%,var(--texto));color:var(--destaque-tinta);border-color:transparent}
.btn-perigo{background:var(--perigo);border-color:var(--perigo);color:var(--sobre-perigo);font-weight:600}
.btn-perigo:hover{background:color-mix(in srgb,var(--perigo) 85%,var(--fundo));color:var(--sobre-perigo)}
.btn-icone{width:var(--alvo);padding:0;justify-content:center}
.kbd{font:500 10.5px/1 var(--f-maq);letter-spacing:.04em;padding:3px 5px;border-radius:var(--r-mini);border:1px solid currentColor;opacity:.7}
.btn-primario .kbd{opacity:.65}

/* ---------- régua ---------- */
.topo{position:sticky;top:0;z-index:30}
.regua{position:relative;z-index:30;display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;background:color-mix(in srgb,var(--fundo) 94%,transparent);border-bottom:1px solid var(--linha)}
.regua .titulo-pauta{background:transparent;min-width:0;flex:0 1 auto;font:600 15px/1.2 var(--f-ui);color:var(--texto);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:28ch;padding:6px 8px;border-radius:6px;border:1px solid transparent}
.regua .titulo-pauta:hover{border-color:var(--linha)}
.regua .titulo-pauta:focus{outline:none;border-color:var(--destaque)}
.chip{font:500 10.5px/1 var(--f-maq);letter-spacing:.1em;text-transform:uppercase;color:var(--cobre);border:1px solid color-mix(in srgb,var(--cobre) 45%,transparent);padding:5px 7px;border-radius:var(--r-chip);white-space:nowrap}
.contador{font:500 11.5px/1 var(--f-maq);letter-spacing:.1em;text-transform:uppercase;color:var(--fumaca);white-space:nowrap}
.contador b{font-weight:600;color:var(--texto);font-variant-numeric:tabular-nums}
.salvo{display:inline-flex;align-items:center;gap:7px;font:500 11px/1 var(--f-maq);letter-spacing:.08em;text-transform:uppercase;color:var(--fumaca);white-space:nowrap}
.salvo i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.salvo[data-s="salvando"] i{background:var(--destaque);animation:pulso 900ms ease-in-out infinite}
.salvo[data-state="error"]{color:var(--perigo)}
.salvo[data-state="error"] i{background:var(--perigo)}
@keyframes pulso{50%{opacity:.25}}
.espaco{flex:1}
.grupo{display:flex;gap:6px;align-items:center}

/* ---------- faixa de preparo ---------- */
.faixa-preparo{position:relative;z-index:29;display:flex;align-items:center;gap:14px;padding:10px 20px;color:var(--texto);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--perigo) 20%,var(--fundo)) 0 10px,color-mix(in srgb,var(--perigo) 13%,var(--fundo)) 10px 20px);border-bottom:1px solid var(--perigo);font-size:14px}
.faixa-preparo strong{font:600 11px/1 var(--f-maq);letter-spacing:.12em;text-transform:uppercase;color:var(--perigo);white-space:nowrap}

/* ---------- mesa e folha ---------- */
.mesa{display:flex;justify-content:center;padding:36px 20px 0}
.coluna{position:relative;width:min(100%,900px);min-height:calc(100vh - 92px);padding:var(--passo) 56px 45vh 96px;
  background-color:color-mix(in srgb,var(--folha) 90%,transparent);
  background-image:linear-gradient(to right,transparent 71px,var(--margem) 71px,var(--margem) 73px,transparent 73px),repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--passo) - 1px),var(--pauta) calc(var(--passo) - 1px),var(--pauta) var(--passo));
  border:1px solid var(--linha);border-bottom:0;border-radius:var(--r-painel) var(--r-painel) 0 0}
.bloco{position:relative;margin:0 0 var(--passo);border-radius:var(--r-ctl)}
.bloco.saindo{animation:some 180ms ease forwards}
@keyframes some{to{opacity:0}}
.bloco.entrando>.conteudo{animation:tinta 460ms cubic-bezier(.2,.9,.3,1) both}
@keyframes tinta{from{clip-path:inset(0 100% 0 0);transform:translateY(8px)}to{clip-path:inset(0 0 0 0);transform:none}}
.texto{display:block;width:100%;min-height:var(--passo);font:500 var(--fs, 30px)/var(--passo) var(--f-ui);letter-spacing:-.008em;color:var(--texto);background:transparent;border:0;outline:none;padding:0;caret-color:var(--destaque);white-space:pre-wrap;overflow-wrap:anywhere}
.texto.t-g{letter-spacing:-.012em}
.texto.t-t{line-height:1.12;padding:6px 0;font-weight:700;letter-spacing:-.022em}
.texto b{font-weight:700}
.texto.t-t b{font-weight:800}
.texto:empty::before{content:attr(data-placeholder);color:var(--fumaca);font-family:var(--f-voz);font-style:italic;font-weight:400}
.texto font[color="#000001"]{color:var(--texto)}
.texto font[color="#000002"]{color:var(--destaque)}
.texto font[color="#000003"]{color:var(--c-vermelho)}
.texto font[color="#000004"]{color:var(--c-verde)}
.texto font[color="#000005"]{color:var(--c-cobre)}
.texto font[color="#000006"]{color:var(--c-lilas)}
.tamanhos{position:absolute;left:0;bottom:calc(100% + 4px);z-index:3;display:none;flex-wrap:wrap;max-width:calc(100vw - 96px);gap:4px;padding:4px;border:1px solid var(--linha);border-radius:var(--r-ctl);background:var(--solido)}
.bloco:focus-within .tamanhos,.bloco:hover .tamanhos{display:flex}
.tamanhos button{height:28px;min-width:32px;padding:0 8px;border-radius:6px;font:600 12px/1 var(--f-maq);letter-spacing:.04em;color:var(--fumaca)}
.tamanhos button:hover{color:var(--texto);background:var(--sup2)}
.tamanhos button[aria-checked="true"]{background:var(--sup2);color:var(--destaque)}
.tamanhos [role="radiogroup"],.tamanhos .ajuste{display:flex;gap:4px;align-items:center}
.tamanhos .ajuste{padding-left:4px;margin-left:4px;border-left:1px solid var(--linha)}
.tamanhos button:disabled{opacity:.35;cursor:default}
.tamanhos .px{padding:0 8px 0 4px;font:500 11px/1 var(--f-maq);letter-spacing:.06em;color:var(--fumaca);font-variant-numeric:tabular-nums}
.barra-sel{position:fixed;z-index:45;display:none;align-items:center;gap:4px;padding:4px;border-radius:var(--r-bloco);background:var(--solido);border:1px solid var(--linha2)}
.barra-sel.on{display:flex}
.barra-sel button{height:34px;min-width:34px;border-radius:var(--r-ctl);display:grid;place-items:center;color:var(--texto2)}
.barra-sel button:hover{background:var(--sup2);color:var(--texto)}
.barra-sel .neg{font:700 16px/1 var(--f-ui)}
.barra-sel .neg[aria-pressed="true"]{background:var(--sup2);color:var(--destaque)}
.barra-sel .ponto i{width:18px;height:18px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px var(--linha2)}
.barra-sel .sep{width:1px;height:22px;margin:0 4px;background:var(--linha)}
.barra-sel .limpar{padding:0 10px;font:500 12.5px/1 var(--f-ui)}

/* calha: controles do bloco, só com foco ou ponteiro */
.calha{position:absolute;left:calc(-88px - var(--recuo) * var(--nivel));top:2px;display:flex;gap:2px;opacity:0;transition:opacity var(--t)}
.bloco:hover .calha,.bloco:focus-within .calha,.preparo .bloco.sel .calha{opacity:1}
.calha button{width:28px;height:40px;border-radius:7px;color:var(--fumaca);display:grid;place-items:center}
.calha button:hover,.calha button:focus-visible{background:var(--sup2);color:var(--texto)}
.calha .alca{cursor:grab;touch-action:none}
.plano{position:static;display:inline-flex;align-items:center;gap:6px;font:italic 15px/1 var(--f-voz);color:var(--cobre);padding:4px 8px;border-radius:6px}
.plano:hover{background:var(--sup2)}
.plano[data-plano="visivel"]{color:var(--ok)}
.bloco.fantasma>.conteudo{opacity:.4}
.bloco.fantasma::after{content:"";position:absolute;inset:-8px -12px;border:1px dashed var(--linha2);border-radius:10px;pointer-events:none;background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--texto) 5%,transparent) 8px 9px)}
.bloco.arrastando{z-index:5;box-shadow:var(--sombra-lift);background:var(--sup);opacity:.96}
.marca-soltar{height:2px;margin:-24px 0 20px;background:var(--destaque);border-radius:2px}

/* mídia */
.midia{position:relative;border:1px solid var(--linha);border-radius:var(--r-bloco);overflow:hidden;background:var(--sup)}
.midia img,.midia video,.midia canvas{display:block;width:100%;height:auto;background:#000}
.legenda{display:flex;align-items:center;gap:10px;min-height:43px;padding:0 14px;border-top:1px solid var(--linha);font:500 11px/1.3 var(--f-maq);letter-spacing:.1em;text-transform:uppercase;color:var(--fumaca)}
.legenda .nome{min-width:0;color:var(--texto2);text-transform:none;letter-spacing:.02em;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tocar{position:absolute;left:16px;bottom:59px;width:56px;height:56px;border-radius:50%;background:var(--destaque);color:var(--destaque-tinta);display:grid;place-items:center;transition:transform var(--t)}
.tocar:hover{transform:scale(1.06)}
.audio{display:flex;align-items:center;gap:16px;padding:16px}
.audio .tocar{position:static;flex:none;width:52px;height:52px}
.onda{flex:1;display:flex;align-items:center;gap:3px;height:52px}
.onda span{flex:1;border-radius:2px;background:var(--linha2);min-height:4px}
.onda span.ja{background:var(--destaque)}
.falha{display:flex;gap:16px;align-items:flex-start;padding:18px;border:1px solid color-mix(in srgb,var(--perigo) 60%,transparent);border-left:3px solid var(--perigo);border-radius:var(--r-bloco);background:color-mix(in srgb,var(--perigo) 7%,var(--sup))}
.falha h3{font:600 17px/1.35 var(--f-ui);color:var(--texto)}
.falha p{color:var(--texto2);font-size:14.5px;margin:4px 0 12px}
.falha .acoes{display:flex;gap:8px;flex-wrap:wrap}
.carregando{padding:18px;border:1px solid var(--linha);border-radius:var(--r-bloco);background:var(--sup)}
.carregando .linha-topo{display:flex;justify-content:space-between;gap:12px;font:500 12px/1.3 var(--f-maq);letter-spacing:.06em;color:var(--texto2);margin-bottom:12px}
.carregando progress{width:100%;height:6px;appearance:none;border:0;border-radius:6px;background:var(--linha);overflow:hidden}
.carregando progress::-webkit-progress-bar{background:var(--linha)}
.carregando progress::-webkit-progress-value{background:var(--destaque);transition:width 200ms linear}
.carregando progress::-moz-progress-bar{background:var(--destaque)}

/* fim da coluna */
.fim{display:block;width:100%;text-align:left;height:var(--passo);font:italic 20px/var(--passo) var(--f-voz);color:var(--fumaca);opacity:0;transition:opacity var(--t);border-radius:6px}
.fim:hover,.fim:focus-visible,.preparo .fim{opacity:1}
.fim-pauta{margin-top:calc(var(--passo) * -1);height:var(--passo);display:flex;align-items:center;gap:10px;font:500 11px/1 var(--f-maq);letter-spacing:.12em;text-transform:uppercase;color:var(--ok)}
.fim-pauta::before{content:"";width:28px;height:1px;background:currentColor}
.vazio{padding:0 0 var(--passo)}
.vazio .grande{font:italic 400 44px/calc(var(--passo) * 2) var(--f-voz);color:var(--texto)}
.vazio p{font-size:19px;line-height:var(--passo);color:var(--texto2);max-width:40ch}
.vazio .atalhos{display:flex;gap:20px;flex-wrap:wrap;margin-top:var(--passo);font:500 11.5px/var(--passo) var(--f-maq);letter-spacing:.08em;text-transform:uppercase;color:var(--fumaca)}

/* soltar arquivos */
.soltar{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:color-mix(in srgb,var(--fundo) 70%,transparent)}
.soltar.on{display:grid}
.soltar div{padding:36px 48px;border:2px dashed var(--destaque);border-radius:var(--r-painel);background:var(--solido);font:italic 26px/1.3 var(--f-voz);color:var(--texto)}

/* ---------- lista de pautas ---------- */
.pagina{max-width:960px;margin:0 auto;padding:56px 24px 96px}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--linha2)}
.eyebrow{font:500 11px/1 var(--f-maq);letter-spacing:.14em;text-transform:uppercase;color:var(--destaque);margin-bottom:12px}
h1{font:700 30px/1.15 var(--f-ui);letter-spacing:-.015em}
.cab p{color:var(--texto2);margin-top:8px;max-width:52ch}
.linha-pauta{display:grid;grid-template-columns:52px 1fr auto;gap:16px;align-items:center;padding:20px 0;border-bottom:1px solid var(--linha)}
.linha-pauta .num{font:500 12px/1 var(--f-maq);color:var(--fumaca);letter-spacing:.06em}
.linha-pauta h2{font:600 19px/1.3 var(--f-ui)}
.linha-pauta h2 button{text-align:left}
.linha-pauta h2 button:hover{color:var(--destaque)}
.linha-pauta .meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font:500 11px/1.3 var(--f-maq);letter-spacing:.08em;text-transform:uppercase;color:var(--fumaca)}
.linha-pauta .acoes{display:flex;gap:6px}
.lista-vazia{padding:72px 0;text-align:left}
.lista-vazia .grande{font:italic 36px/1.3 var(--f-voz)}
.lista-vazia p{color:var(--texto2);margin:10px 0 24px}

/* ---------- painel de aparência ---------- */
.painel{position:fixed;top:0;right:0;bottom:0;z-index:50;width:min(100%,380px);background:var(--solido);border-left:1px solid var(--linha2);display:flex;flex-direction:column;transform:translateX(100%);transition:transform 220ms cubic-bezier(.2,.9,.3,1)}
.painel.on{transform:none}
.painel header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--linha)}
.painel h2{font:600 19px/1.2 var(--f-ui)}
.painel .corpo{overflow:auto;padding:8px 20px 28px}
.painel section{padding:18px 0;border-bottom:1px solid var(--linha)}
.painel h3{font:500 11px/1 var(--f-maq);letter-spacing:.12em;text-transform:uppercase;color:var(--fumaca);margin-bottom:12px}
.temas{display:grid;gap:8px}
.tema{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;padding:8px;border:1px solid var(--linha);border-radius:var(--r-bloco);text-align:left}
.tema:hover{border-color:var(--linha2)}
.tema[aria-checked="true"]{border-color:var(--destaque);box-shadow:inset 0 0 0 1px var(--destaque)}
.amostra{height:44px;border-radius:6px;border:1px solid rgba(128,128,128,.25);position:relative;overflow:hidden}
.amostra::after{content:"";position:absolute;left:8px;right:8px;top:12px;height:5px;border-radius:3px;background:var(--a-texto);box-shadow:0 10px 0 var(--a-texto),0 20px 0 var(--a-dest)}
.tema b{display:block;font:600 14px/1.3 var(--f-ui)}
.tema small{color:var(--fumaca);font-size:12.5px}
.linha-cor{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
input[type=color]{width:44px;height:34px;border:1px solid var(--linha2);border-radius:8px;background:var(--sup);padding:3px;cursor:pointer}
.aviso{margin-top:10px;font-size:13px;color:var(--perigo)}
.aviso.ok{color:var(--ok)}
.segmentos{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--linha);border-radius:var(--r-ctl);overflow:hidden;margin-bottom:12px}
.segmentos button{height:34px;font-size:12.5px;color:var(--texto2);border-right:1px solid var(--linha)}
.segmentos button:last-child{border-right:0}
.segmentos button[aria-checked="true"]{background:var(--sup2);color:var(--texto);font-weight:600}
.gradientes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.nota-mono{font:500 11px/1.5 var(--f-maq);letter-spacing:.06em;color:var(--fumaca);margin-top:10px}

.modal{width:min(100%,440px);background:var(--solido);border:1px solid var(--linha2);border-left:3px solid var(--destaque);border-radius:var(--r-painel);padding:24px}
.modal.destrutivo{border-left-color:var(--perigo)}
.modal h2{font:600 19px/1.3 var(--f-ui);margin-bottom:8px}
.modal p{color:var(--texto2);font-size:14.5px}
.modal label{display:block;font:500 11px/1 var(--f-maq);letter-spacing:.1em;text-transform:uppercase;color:var(--fumaca);margin:16px 0 8px}
.modal input[type=text]{width:100%;height:44px;padding:0 12px;border-radius:var(--r-ctl);border:1px solid var(--linha2);background:var(--sup);font-size:15px}
.modal input[type=text]:focus{outline:none;border-color:var(--destaque)}
.modal .erro-campo{color:var(--perigo);font-size:13px;margin-top:6px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:var(--r-bloco);background:var(--solido);border:1px solid var(--linha2);font-size:14px;color:var(--texto);box-shadow:var(--sombra-toast)}

.tour-veu{position:fixed;inset:0;z-index:90;pointer-events:auto}
.holofote{position:fixed;border-radius:var(--r-bloco);box-shadow:0 0 0 2px var(--destaque),0 0 0 9999px var(--veu-tour);transition:all 260ms cubic-bezier(.2,.9,.3,1);pointer-events:none}

  const t = tomada(p.id);
  const ids = p.blocos.slice(i, fimSubarvore(p.blocos, i)).filter((b) => !visivelProprio(p.id, b)).map((b) => b.id);
  ids.forEach((id) => { t.mostrar[id] = true; });
  t.pilha.push(ids.length === 1 ? ids[0] : ids);
  E.sel = p.blocos[i].id;
  renderPauta({ entrando: ids });
  if (ids.length > 1) toast(`Tópico revelado com ${plural(ids.length - 1, 'sub-item', 'sub-itens')}. <span class="kbd">PgUp</span> oculta o grupo.`);

}
function ocultarGrupo(p, ids) {
  const t = tomada(p.id);
  ids.forEach((id) => { t.mostrar[id] = false; tirarDaPilha(t, id); if (E.tocando === id) alternarMidia(id); });
  const els = ids.map((id) => $(`.bloco[data-id="${id}"]`)).filter(Boolean);
  if (els.length && !E.preparo && !reduzido()) { els.forEach((el) => el.classList.add('saindo')); setTimeout(() => renderPauta(), 180); }
  else renderPauta();

}


/* ---------- rota ---------- */
function rota() {
  const h = location.hash.replace(/^#/, '') || '/pauta/p1';
  const [caminho, qs] = h.split('?');
  const q = new URLSearchParams(qs || '');
  const partes = caminho.split('/').filter(Boolean);
  if (partes[0] === 'pautas') return { tela: 'lista', q };
  return { tela: 'pauta', id: partes[1] || 'p1', q };
}

/* ---------- salvamento automático (simulado) ---------- */
let tSalvo;
function alterou() {

  E.salvo = { s: 'salvando' }; renderSalvo();

/* ---------- modal do design system ---------- */
let modalFechar = null;
function modal({ titulo, texto, confirmar, destrutivo = false, campo = null, aoConfirmar }) {
  fecharModal();
  const veu = document.createElement('div');
  veu.className = 'veu'; veu.dataset.aiosonId = 'modal';
  veu.innerHTML = `<div class="modal ${destrutivo ? 'destrutivo' : ''}" role="dialog" aria-modal="true" aria-labelledby="m-t">
    <h2 id="m-t">${esc(titulo)}</h2><p>${texto}</p>
    ${campo ? `<label for="m-c">${esc(campo.rotulo)}</label><input id="m-c" type="text" maxlength="90" autocomplete="off" value="${esc(campo.valor || '')}"><div class="erro-campo" id="m-e" role="alert" hidden></div>` : ''}
    <footer><button class="btn" data-a="cancelar">Cancelar</button><button class="btn ${destrutivo ? 'btn-perigo' : 'btn-primario'}" data-a="ok">${esc(confirmar)}</button></footer></div>`;
  document.body.append(veu);
  const foco = $$('button,input', veu);
  const ok = () => {
    if (campo) {
      const v = $('#m-c').value.trim();
      if (!v) { const e = $('#m-e'); e.hidden = false; e.textContent = 'Dê um nome à pauta, por exemplo "Episódio 12: filas".'; $('#m-c').setAttribute('aria-invalid', 'true'); return; }
      aoConfirmar(v);
    } else aoConfirmar();
    fecharModal();
  };
  veu.addEventListener('click', (e) => { if (e.target === veu || e.target.dataset.a === 'cancelar') fecharModal(); if (e.target.dataset.a === 'ok') ok(); });
  veu.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); fecharModal(); }
    if (e.key === 'Enter' && campo) { e.preventDefault(); ok(); }
    if (e.key === 'Tab') { const i = foco.indexOf(document.activeElement); if (e.shiftKey && i <= 0) { e.preventDefault(); foco.at(-1).focus(); } else if (!e.shiftKey && i === foco.length - 1) { e.preventDefault(); foco[0].focus(); } }
  });
  const antes = document.activeElement;
  modalFechar = () => { veu.remove(); modalFechar = null; antes && antes.focus && antes.focus(); };
  (campo ? $('#m-c') : $('[data-a="ok"]', veu)).focus();

}

function autoAltura(ta) { ta.style.height = 'auto'; ta.style.height = Math.max(44, ta.scrollHeight) + 'px'; }

/* mídia pousa na pauta: completa a altura até o próximo múltiplo de 44px */
function alinharNaPauta() {
  const passo = 44;

    el.style.paddingBottom = '0px';
    const h = el.getBoundingClientRect().height;

  });

/* ---------- formatação de texto (rodada 2: F15, F16, F17) ---------- */
const CORES_TEXTO = [

  ['vermelho', '#000003', 'Vermelho', '--c-vermelho'], ['verde', '#000004', 'Verde', '--c-verde'],

const SENTINELAS = new Set(CORES_TEXTO.map((c) => c[1]));

function ajusteHTML(b) {

}
function atualizarTamanhoUI(b) {

function aplicarEstado(r) {

  const st = r.q.get('state');
  E.preparo = r.q.get('preparo') === '1' ? true : E.preparo;
  E.falhaSalvar = st === 'error';
  if (st === 'empty') { p.blocos = []; }
  if (st === 'error' && !p.blocos.some((b) => b.tipo === 'falha')) {
    p.blocos.splice(3, 0, { id: novoId(), tipo: 'falha', falha: 'ausente', nome: 'gravacao-de-tela-03.mp4', plano: 'visivel' });
  }
  if (st === 'loading' && !p.blocos.some((b) => b.tipo === 'carregando')) {
    p.blocos.splice(2, 0, { id: novoId(), tipo: 'carregando', nome: 'gravacao-de-tela-04.mp4', progresso: 64, plano: 'visivel', destino: 'video', simulado: true, dur: 12, congelado: true });

  if (st === 'success') { const t = tomada(p.id); p.blocos.forEach((b) => { t.mostrar[b.id] = true; }); }
